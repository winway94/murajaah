<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tasbih Digital</title>
<meta name="theme-color" content="#0F332C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Amiri+Quran&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#164A40;
  --primary-dark:#0F332C;
  --accent:#B99A45;
  --accent-soft:#E8D9B0;
  --white:#FFFFFF;
  --font-sans:'Inter','Segoe UI',sans-serif;
  --transition:all .25s ease;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{margin:0;font-family:var(--font-sans);color:var(--white);overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
button{font-family:var(--font-sans);}

.stage{min-height:100vh;max-width:480px;margin:0 auto;position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  background:radial-gradient(120% 90% at 50% -10%, var(--primary) 0%, var(--primary-dark) 62%);}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(45deg, rgba(185,154,69,0.07) 0 1px, transparent 1px 42px),
    repeating-linear-gradient(-45deg, rgba(185,154,69,0.07) 0 1px, transparent 1px 42px);}

/* ---------- glow ambient di belakang angka, "napas" pelan ---------- */
.glow{position:absolute;top:18%;left:50%;width:340px;height:340px;transform:translateX(-50%);
  background:radial-gradient(circle, rgba(185,154,69,0.35) 0%, rgba(185,154,69,0) 70%);
  border-radius:50%;animation:breathe 4.2s ease-in-out infinite;pointer-events:none;}
@keyframes breathe{0%,100%{opacity:.55;transform:translateX(-50%) scale(1);}50%{opacity:.9;transform:translateX(-50%) scale(1.08);}}

.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;
  padding:calc(16px + env(safe-area-inset-top)) 18px 6px;}
.icon-btn{background:rgba(255,255,255,0.08);border:1px solid rgba(185,154,69,0.35);border-radius:50%;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--accent-soft);}
.icon-btn:active{background:rgba(185,154,69,0.2);}
.topbar-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-soft);font-weight:700;opacity:.85;}

/* ---------- pemilih lafaz, swipe-like chips tipis ---------- */
.dzikir-picker{position:relative;display:flex;justify-content:center;gap:8px;padding:6px 18px 0;flex-wrap:wrap;}
.dzikir-chip{font-size:11.5px;font-weight:700;color:rgba(255,255,255,0.55);background:transparent;
  border:1px solid rgba(255,255,255,0.18);border-radius:99px;padding:7px 14px;cursor:pointer;}
.dzikir-chip.active{color:var(--primary-dark);background:var(--accent);border-color:var(--accent);}

/* ---------- pusat: kaligrafi + angka besar ---------- */
.center-zone{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 24px;text-align:center;}
.arabic-word{font-family:'Amiri Quran',serif;font-size:34px;color:var(--accent-soft);margin:0 0 6px;
  transition:var(--transition);}
.latin-word{font-size:12px;color:rgba(255,255,255,0.6);letter-spacing:.06em;margin:0 0 26px;text-transform:uppercase;}
.big-num{font-size:104px;font-weight:800;line-height:.95;font-variant-numeric:tabular-nums;
  text-shadow:0 0 40px rgba(185,154,69,0.4);}
.sub-target{font-size:13px;color:rgba(255,255,255,0.55);margin-top:10px;}
.sub-target b{color:var(--accent);}
.round-pill{margin-top:18px;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  color:var(--primary-dark);background:var(--accent);padding:6px 14px;border-radius:99px;}

/* ---------- area tap: bulat cincin ganda (opsi 3), sama gayanya
   dengan Desain A, disesuaikan warnanya ke nuansa ambient ---------- */
.tap-zone{position:relative;flex-shrink:0;display:flex;flex-direction:column;align-items:center;
  padding:0 24px calc(20px + env(safe-area-inset-bottom));}
.tap-btn-wrap{width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,0.35);
  display:flex;align-items:center;justify-content:center;padding:6px;}
.tap-circle{width:100%;height:100%;border-radius:50%;background:var(--accent);border:none;
  color:var(--primary-dark);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 10px 24px rgba(185,154,69,0.4);cursor:pointer;}
.tap-circle:active{transform:scale(.94);box-shadow:0 6px 16px rgba(185,154,69,0.3);}
.mini-controls{display:flex;justify-content:center;gap:22px;margin-top:18px;}
.mini-btn{background:none;border:none;color:rgba(255,255,255,0.55);font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px;}
.mini-btn:active{color:var(--accent-soft);}

/* ---------- info sheet ---------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:flex-end;justify-content:center;z-index:70;}
.sheet-backdrop.show{display:flex;}
.sheet{width:100%;max-width:480px;background:var(--primary-dark);border-radius:20px 20px 0 0;
  padding:22px 22px calc(20px + env(safe-area-inset-bottom));border-top:1px solid rgba(185,154,69,0.35);}
.sheet-title{font-size:15px;font-weight:800;margin:0 0 6px;color:var(--accent-soft);}
.sheet-text{font-size:12.5px;color:rgba(255,255,255,0.6);line-height:1.6;margin:0 0 18px;}
.sheet-row-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin:0 0 8px;}
.sheet-targets{display:flex;gap:8px;margin-bottom:20px;}
.sheet-target-chip{flex:1;text-align:center;padding:10px 0;border-radius:10px;font-size:13px;font-weight:700;
  border:1.5px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.7);cursor:pointer;}
.sheet-target-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(185,154,69,0.12);}
.sheet-actions{display:flex;gap:10px;}
.sheet-btn{flex:1;padding:13px 0;border-radius:12px;font-size:14px;font-weight:700;border:none;cursor:pointer;}
.sheet-btn.cancel{background:rgba(255,255,255,0.08);color:var(--white);}
.sheet-btn.confirm{background:#C75B50;color:var(--white);}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);color:var(--white);font-size:13px;font-weight:600;
  padding:11px 18px;border-radius:99px;transition:.25s ease;pointer-events:none;z-index:80;white-space:nowrap;
  border:1px solid rgba(185,154,69,0.4);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>

  <div class="topbar">
    <a class="icon-btn" href="index.html" aria-label="Kembali">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <span class="topbar-title">Tasbih Digital</span>
    <button class="icon-btn" id="menuBtn" aria-label="Pengaturan">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-1 1.47V21a2 2 0 1 1-4 0v-.09a1.6 1.6 0 0 0-1-1.47 1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-1H3a2 2 0 1 1 0-4h.09a1.6 1.6 0 0 0 1.47-1 1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.6 1.6 0 0 0 1.77.32H9a1.6 1.6 0 0 0 1-1.47V3a2 2 0 1 1 4 0v.09a1.6 1.6 0 0 0 1 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.77V9a1.6 1.6 0 0 0 1.47 1H21a2 2 0 1 1 0 4h-.09a1.6 1.6 0 0 0-1.47 1z" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
  </div>

  <div class="dzikir-picker" id="dzikirPicker"></div>

  <div class="center-zone">
    <p class="arabic-word" id="arabicWord">سُبْحَانَ اللَّٰهِ</p>
    <p class="latin-word" id="latinWord">Subhanallah</p>
    <div class="big-num" id="bigNum">0</div>
    <p class="sub-target">dari <b id="targetVal">33</b></p>
    <div class="round-pill" id="roundPill" style="display:none;">Putaran ke- <span id="roundVal">0</span></div>
  </div>

  <div class="tap-zone">
    <div class="tap-btn-wrap"><button class="tap-circle" id="tapBtn">TAP</button></div>
    <div class="mini-controls">
      <button class="mini-btn" id="minusBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Kurangi
      </button>
      <button class="mini-btn" id="resetBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 1 1 2.64 6.36" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 8v5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Reset
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="sheet-backdrop" id="settingsSheet">
  <div class="sheet">
    <p class="sheet-title">Pengaturan Zikir</p>
    <p class="sheet-text">Pilih target putaran untuk lafaz yang sedang aktif. Reset akan mengembalikan hitungan &amp; putaran zikir ini ke 0.</p>
    <p class="sheet-row-label">Target Hitungan</p>
    <div class="sheet-targets" id="sheetTargets"></div>
    <div class="sheet-actions">
      <button class="sheet-btn cancel" id="closeSheet">Tutup</button>
      <button class="sheet-btn confirm" id="confirmResetSheet">Reset Hitungan</button>
    </div>
  </div>
</div>

<script>
const DZIKIR = [
  { key:'subhanallah', label:'Subhanallah', arabic:'سُبْحَانَ اللَّٰهِ' },
  { key:'alhamdulillah', label:'Alhamdulillah', arabic:'الْحَمْدُ لِلَّٰهِ' },
  { key:'allahuakbar', label:'Allahu Akbar', arabic:'اللَّٰهُ أَكْبَرُ' },
  { key:'bebas', label:'Bebas', arabic:'ذِكْرُ اللَّٰهِ' },
];
const TARGETS = [33, 99, 100];
const STORE_KEY = 'tasbih_v1_ambient_state';

let state = loadState();
let activeKey = state.lastActive || DZIKIR[0].key;

function loadState(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  const init = { lastActive: DZIKIR[0].key, items: {} };
  DZIKIR.forEach(d => init.items[d.key] = { count:0, round:0, target:33 });
  return init;
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
function ensureItem(key){
  if (!state.items[key]) state.items[key] = { count:0, round:0, target:33 };
  return state.items[key];
}
function vibrate(ms){ if (navigator.vibrate) navigator.vibrate(ms); }

/* ---------- Wake Lock: layar jangan mati SELAMA halaman Tasbih ini ----------
   sedang aktif dibuka (dipakai buat ketuk/hitung, jadi jangan sampai
   mati sendiri di tengah hitungan) -- TAPI dilepas begitu halaman
   disembunyikan (pindah tab/app lain, atau layar dikunci manual), supaya
   TIDAK menyala terus tanpa henti di luar itu. Dipasang ulang otomatis
   begitu balik lagi ke halaman ini (visibilitychange). */
let tasbihWakeLock = null;
async function requestTasbihWakeLock(){
  if (!('wakeLock' in navigator)) return;
  try{
    tasbihWakeLock = await navigator.wakeLock.request('screen');
    tasbihWakeLock.addEventListener('release', () => { tasbihWakeLock = null; });
  }catch(e){ /* mis. baterai hemat daya aktif -- abaikan senyap */ }
}
async function releaseTasbihWakeLock(){
  if (tasbihWakeLock){
    try{ await tasbihWakeLock.release(); }catch(e){}
    tasbihWakeLock = null;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestTasbihWakeLock();
  else releaseTasbihWakeLock();
});
requestTasbihWakeLock();

const dzikirPicker = document.getElementById('dzikirPicker');
DZIKIR.forEach(d => {
  const btn = document.createElement('button');
  btn.className = 'dzikir-chip';
  btn.textContent = d.label;
  btn.dataset.key = d.key;
  btn.onclick = () => { activeKey = d.key; state.lastActive = d.key; saveState(); render(); };
  dzikirPicker.appendChild(btn);
});

const sheetTargets = document.getElementById('sheetTargets');
TARGETS.forEach(t => {
  const btn = document.createElement('button');
  btn.className = 'sheet-target-chip';
  btn.textContent = t;
  btn.dataset.target = t;
  btn.onclick = () => { ensureItem(activeKey).target = t; saveState(); render(); };
  sheetTargets.appendChild(btn);
});

const arabicWord = document.getElementById('arabicWord');
const latinWord = document.getElementById('latinWord');
const bigNum = document.getElementById('bigNum');
const targetVal = document.getElementById('targetVal');
const roundPill = document.getElementById('roundPill');
const roundVal = document.getElementById('roundVal');
const toastEl = document.getElementById('toast');
let toastTimer = null;

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}
function render(){
  const item = ensureItem(activeKey);
  const d = DZIKIR.find(x => x.key === activeKey);
  document.querySelectorAll('.dzikir-chip').forEach(b => b.classList.toggle('active', b.dataset.key === activeKey));
  document.querySelectorAll('.sheet-target-chip').forEach(b => b.classList.toggle('active', Number(b.dataset.target) === item.target));
  arabicWord.textContent = d.arabic;
  latinWord.textContent = d.label;
  bigNum.textContent = item.count;
  targetVal.textContent = item.target;
  if (item.round > 0) { roundPill.style.display = 'inline-flex'; roundVal.textContent = item.round; }
  else { roundPill.style.display = 'none'; }
}

document.getElementById('tapBtn').addEventListener('click', () => {
  const item = ensureItem(activeKey);
  item.count += 1;
  vibrate(12);
  if (item.count >= item.target) {
    item.round += 1;
    item.count = 0;
    vibrate([15, 60, 15]);
    showToast('Putaran ke-' + item.round + ' selesai \u2014 mulai lagi dari 0');
  }
  saveState();
  render();
});
document.getElementById('minusBtn').addEventListener('click', () => {
  const item = ensureItem(activeKey);
  if (item.count > 0) { item.count -= 1; saveState(); render(); }
});
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('settingsSheet').classList.add('show');
});
document.getElementById('closeSheet').addEventListener('click', () => {
  document.getElementById('settingsSheet').classList.remove('show');
});
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('settingsSheet').classList.add('show');
});
document.getElementById('confirmResetSheet').addEventListener('click', () => {
  const item = ensureItem(activeKey);
  item.count = 0; item.round = 0;
  saveState(); render();
  document.getElementById('settingsSheet').classList.remove('show');
  showToast('Hitungan direset');
});

render();
</script>
</body>
</html>
